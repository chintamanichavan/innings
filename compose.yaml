services:
  # The data and the models: Python and FastAPI. Reached only through the website.
  api:
    build: .
    image: innings-api:0.14.0
    container_name: innings-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      INNINGS_KAFKA: kafka:9092

  # The message broker of the live stream. It keeps nothing worth saving: every match in it
  # can be replayed from the database, so it has no volume.
  kafka:
    image: apache/kafka:4.1.0
    container_name: innings-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:19092:19092"   # for running the stream tools from this machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INSIDE://:9092,HOST://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,HOST://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m

  # Replays past matches into Kafka, ball by ball, at the pace of a live game.
  bowler:
    image: innings-api:0.14.0
    container_name: innings-bowler
    restart: unless-stopped
    depends_on: [kafka, api]
    command: ["innings", "stream", "bowl"]
    volumes:
      - ./data:/app/data
    environment:
      INNINGS_KAFKA: kafka:9092

  # Reads each ball from Kafka, keeps the score, and adds the win chance.
  scorer:
    image: innings-api:0.14.0
    container_name: innings-scorer
    restart: unless-stopped
    depends_on: [kafka, api]
    command: ["innings", "stream", "score"]
    volumes:
      - ./data:/app/data
    environment:
      INNINGS_KAFKA: kafka:9092

  # The website: TypeScript and Next.js. Passes every /api request on to `api`.
  web:
    build: ./frontend
    image: innings-web:0.19.0
    container_name: innings-web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:8453:3000"
    environment:
      API_URL: http://api:8453

  # Downloads fresh data and rebuilds the models twice a day. The API picks up the new
  # database on its own.
  refresh:
    image: innings-api:0.14.0
    container_name: innings-refresh
    restart: unless-stopped
    depends_on: [api]
    command: ["innings", "refresh", "--every", "12"]
    volumes:
      - ./data:/app/data
